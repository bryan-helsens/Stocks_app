# =============================================================================
# DivTrack — Docker Compose orchestration (single-host dev / small production).
# Services: postgres, redis, minio, api, worker, beat (+ optional ollama, flower).
# Bring up with:  make up   (or: docker compose up -d --build)
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-divtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-divtrack}
      POSTGRES_DB: ${POSTGRES_DB:-divtrack}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-divtrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["./entrypoint.sh"]
    command:
      - gunicorn
      - app.main:app
      - --worker-class=uvicorn.workers.UvicornWorker
      - --workers=4
      - --bind=0.0.0.0:8000
      - --access-logfile=-
    volumes:
      - report_data:/data/divtrack
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    volumes:
      - report_data:/data/divtrack

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]

  # ----- Optional services (enable with: docker compose --profile extras up) --
  flower:
    image: mher/flower:latest
    profiles: ["extras"]
    command: ["celery", "--broker=${CELERY_BROKER_URL:-redis://redis:6379/1}", "flower", "--port=5555"]
    depends_on:
      - redis
    ports:
      - "5555:5555"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai-local"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pg_data:
  redis_data:
  minio_data:
  report_data:
  ollama_data:
