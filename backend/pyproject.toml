[project]
name = "divtrack-backend"
version = "0.1.0"
description = "DivTrack — portfolio, dividend, FIRE & tax (BE) management API. Educational/informational only — no financial, tax or legal advice."
requires-python = ">=3.12"
readme = "../README.md"

dependencies = [
    # Web / ASGI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "python-multipart>=0.0.12",
    # Validation / settings
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Cache / broker / tasks
    "redis>=5.2",
    "celery>=5.4",
    # Security
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7",
    # bcrypt is pinned < 4.1: passlib 1.7.x reads bcrypt.__about__ which newer
    # bcrypt releases removed, breaking password hashing.
    "bcrypt>=4.0,<4.1",
    "pyotp>=2.9",
    "cryptography>=43.0",
    # HTTP clients / providers
    "httpx>=0.27",
    "yfinance>=0.2.50",
    # Data / reports
    "pandas>=2.2",
    "openpyxl>=3.1",
    "weasyprint>=63.0",
    "jinja2>=3.1",
    # Observability
    "structlog>=24.4",
    "sentry-sdk>=2.18",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-passlib",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
