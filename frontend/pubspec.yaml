name: divtrack
description: >-
  DivTrack — portfolio, dividend, FIRE & Belgian tax management.
  Educational/informational only — no financial, tax or legal advice.
publish_to: "none"
version: 0.1.0+1

environment:
  # Dart 3.6 / Flutter 3.27+ for the Color.withValues API used in theming.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.1

  # Networking
  dio: ^5.7.0

  # Secure local storage & biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Charts
  fl_chart: ^0.69.2

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  generate: true
